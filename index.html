<!DOCTYPE html>
<html lang="ko" data-skin="mono">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summer 플래너</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="플래너">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: index column at left, one working sheet at right, a timer strip pinned to the bottom while a task runs.
   Black on white with thin rules; follows dark mode. Category colors are the only hue. */
:root{
  --bg:#e9e6df;
  --paper:#fcfbf8;
  --ink:#24211d;
  --muted:#7d786f;
  --line:#d9d4c9;
  --hl:#ffe55e;
  --alert:#c4453b;
  --sticky:#fff1a6;
  --font-display:"Nanum Pen Script", "Segoe Print", cursive;
  --font-body:"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num:"Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
:root[data-skin="mono"]{
  --bg:#ffffff; --paper:#ffffff; --ink:#111111; --muted:#6c6c6c; --line:#e3e3e3; --hl:#111111; --alert:#d0352b; --sticky:#111111; --cover-empty:#f4f4f4;
  --font-display:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root[data-skin="mono"]:not([data-theme="light"]){
    --bg:#0f0f0f; --paper:#0f0f0f; --ink:#f0f0f0; --muted:#9b9b9b; --line:#2a2a2a; --hl:#f0f0f0; --alert:#ff6d61; --sticky:#f0f0f0; --cover-empty:#181818;
    color-scheme: dark;
  }
}
:root[data-skin="mono"][data-theme="dark"]{
  --bg:#0f0f0f; --paper:#0f0f0f; --ink:#f0f0f0; --muted:#9b9b9b; --line:#2a2a2a; --hl:#f0f0f0; --alert:#ff6d61; --sticky:#f0f0f0; --cover-empty:#181818;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
[hidden]{display:none!important}

.cover{position:relative;height:clamp(150px, 22vw, 250px);background:var(--cover-empty);overflow:hidden}
.cover.empty{height:110px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.cover.busy img{opacity:.55}
.cover.moving img{cursor:grab;touch-action:none}
.cover.moving img:active{cursor:grabbing}
.cover-tools{position:absolute;right:max(16px, calc((100% - 1020px) / 2 + 20px));bottom:12px;display:flex;gap:6px}
.cover-tools button,.cover-tools label{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:50%;background:rgba(17,17,17,.55);color:#fff;cursor:pointer;padding:0}
.cover-tools button:hover,.cover-tools label:hover{background:rgba(17,17,17,.8)}
.cover.empty .cover-tools button,.cover.empty .cover-tools label{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.cover.empty .cover-tools label:hover{color:var(--ink);border-color:var(--ink)}
.cover-tools svg{width:16px;height:16px}
.cover-tools input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cover-tools label:focus-within{outline:2px dashed var(--ink);outline-offset:2px}
.cover.moving .cover-tools .move{background:#fff;color:#111}
.app{max-width:1020px;margin:0 auto;padding:24px 20px 56px;display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:start}

/* ---------- index column ---------- */
aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:18px}
.brand{margin:4px 0 0;line-height:1}
nav.views{display:flex;flex-direction:column;gap:2px}
nav.views button,.catlist button{display:flex;align-items:baseline;gap:8px;border:0;background:transparent;text-align:left;color:var(--muted)}
nav.views button:hover,.catlist button:hover{color:var(--ink)}
nav.views button[aria-current="true"],.catlist button[aria-current="true"]{color:var(--ink)}
.n{font-family:var(--font-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.views .sep{height:0;border-top:1px dashed var(--line);margin:8px 4px}
.cats{display:flex;flex-direction:column;gap:6px}
.cats-head{white-space:nowrap;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.catlist{display:flex;flex-direction:column;gap:2px}
.catlist button{padding:3px 4px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cat,transparent);display:inline-block;flex:0 0 auto;transform:translateY(-1px)}
.dot.none{border:1px dashed var(--muted)}
.rail-foot{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.6}
.linkbtn{align-self:flex-start;border:0;background:transparent;padding:0;font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- sheet ---------- */
.sheet{position:relative;min-width:0}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dayhead{display:flex;align-items:flex-end;gap:10px;line-height:.9}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:#5d8b5f}
.status.warn i{background:#c98a1a}
.status.bad i{background:var(--alert)}
.status.bad{color:var(--alert)}
.alarm-btn{border:0;background:transparent;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.alarm-btn.on{text-decoration:none;color:var(--ink)}

h2.view{margin:18px 0 6px;font-weight:400;line-height:1.1}

/* add form */
form.add{display:flex;flex-direction:column;gap:10px;margin:4px 0 18px}
.add-line{display:flex;align-items:center;gap:8px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;padding:3px 10px;font-size:13px;color:var(--muted)}
.catpick button:hover{border-color:var(--ink);color:var(--ink)}
.catpick button{border-radius:999px}
.catpick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.catpick button[data-pick]:not([data-pick=""]):not(.add-cat)[aria-pressed="true"]{background:var(--cat)}
.catpick button[aria-pressed="true"] .dot{display:none}
.catpick button[aria-pressed="true"][data-pick]:not([data-pick=""]){color:#1d1d1d}
.catpick .add-cat{border-style:dashed;padding:3px 11px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;background:transparent;color:var(--muted);padding:0}
.icon-btn:hover{color:var(--alert)}
.icon-btn svg{width:16px;height:16px}
.title-in{flex:1;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:6px 2px;font-size:17px;outline:none;min-width:0}
.add-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}
.fld{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.quick{display:inline-flex;gap:10px}
.quick button{border:0;background:transparent;padding:0 2px;font-size:13.5px;color:var(--muted)}
input[type="date"],input[type="time"],select.sel{border:0;border-bottom:1px dotted var(--muted);background:transparent;padding:1px 2px;font-size:13px;color:var(--ink);font-family:var(--font-num);border-radius:0}
select.sel{font-family:var(--font-body);padding-right:4px}
.primary{border:1.5px solid var(--ink);background:transparent;padding:0 14px}

.listbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:2px}
.listbar label{display:inline-flex;align-items:center;gap:6px}

/* list */
section.group{margin-top:14px}
section.group h3{margin:0 0 2px;font-weight:400;display:flex;align-items:baseline;gap:8px}
section.group.late h3{color:var(--alert)}
ul.list{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:start;padding:5px 0}
li.row.has-handle{grid-template-columns:20px 26px 1fr}
li.row.dragging{opacity:.55}
.handle{border:0;background:transparent;color:var(--muted);height:32px;padding:0;cursor:grab;touch-action:none;font-size:14px;letter-spacing:-3px;user-select:none}
.handle:active{cursor:grabbing}
.check{position:relative;display:flex;align-items:center;justify-content:center;height:32px;cursor:pointer}
.check input{position:absolute;opacity:0;width:22px;height:22px;margin:0;cursor:pointer}
.check .box{width:17px;height:17px;border:1.6px solid var(--ink);position:relative;background:var(--paper)}
.check input:focus-visible + .box{outline:2px dashed var(--ink);outline-offset:3px}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.line1{display:flex;align-items:flex-start;gap:8px;min-width:0}
.line1 > .pill,.line1 > .acts{margin-top:5px}
.title{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;padding:5px 2px 3px;font-size:16px;line-height:1.45;outline:none;resize:none;overflow:hidden;display:block;font-family:inherit;color:inherit;overflow-wrap:anywhere;word-break:keep-all;white-space:pre-wrap}
.title:focus{border-bottom-color:var(--ink)}
.done-title{flex:1;min-width:0;padding:5px 2px 3px;font-size:16px;line-height:1.45;overflow-wrap:anywhere;word-break:keep-all}
.acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;padding-left:2px;font-size:12.5px}
li.row.done .meta{opacity:.7}
.chip{font-family:var(--font-body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.alert{color:var(--alert)}
.chip.strong{color:var(--ink)}
.cat{display:inline-flex;align-items:center;font-size:12px;background:var(--cat);color:#1d1d1d;border-radius:5px;padding:1px 8px;line-height:1.5}
.cat .dot{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;border:1px solid var(--ink);border-radius:999px;padding:1px 9px;font-family:var(--font-num);font-size:12.5px;line-height:1.5;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:12px;height:12px;display:block}
.pill button{border:0;background:transparent;padding:0;color:inherit;font:inherit;line-height:inherit;cursor:pointer}
.pill .pill-time:hover{text-decoration:underline;text-underline-offset:3px}
.pill .pill-bell{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:-5px;border-radius:50%}
.pill .pill-bell:hover{background:var(--line)}
.pill .pill-bell.off{color:var(--muted)}
.pill.editing{border-style:dashed}
.pill-input{width:46px;border:0;background:transparent;padding:0;font:inherit;color:inherit;outline:none;text-align:center}
li.row.done .pill{border-color:var(--line);color:var(--muted)}
.add-line .pill{font-size:13.5px;padding:2px 11px;cursor:pointer}
.add-line .pill:hover{text-decoration:line-through}
.mini{border:0;background:transparent;font-size:12.5px;color:var(--muted);padding:0}
.mini:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.mini.danger:hover{color:var(--alert)}
.ico{display:none}
.chipbtn{position:relative;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chipbtn:hover{border-color:var(--ink);color:var(--ink)}
.chipbtn.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.chipbtn svg{width:14px;height:14px;flex:0 0 auto}
.chipbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer;font-size:16px}
.chipbtn input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tbtn{border:1px solid var(--ink);background:transparent;font-size:12px;padding:1px 9px;line-height:1.5;white-space:nowrap}
.tbtn.on{background:var(--ink);color:var(--paper)}
.note-preview{margin:2px 0 0;padding-left:10px;border-left:2px solid var(--line);font-size:13.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin:8px 0 6px;padding:10px 12px;border-left:2px solid var(--line)}
.detail label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.detail .wide{grid-column:1/-1}
.detail input.time-text{border:0;border-bottom:1px solid var(--line);background:transparent;padding:1px 2px;font-size:13px;font-family:var(--font-num);color:var(--ink);outline:none;border-radius:0}
.detail input.time-text:focus{border-bottom-color:var(--ink)}
.detail textarea{border:1px solid var(--line);background:transparent;padding:6px 8px;font-size:14px;min-height:64px;resize:vertical;width:100%;outline:none;color:var(--ink)}
.detail .links{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px}
.detail a{color:var(--ink);text-underline-offset:3px}
.trash-title{padding:5px 2px;color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:20px 0 8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:13px;color:var(--muted)}
.banner .note-sticky{display:block;max-width:460px;margin:8px 0;padding:10px 14px;font-size:13.5px;line-height:1.55}

/* toast, timer, modal */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);z-index:30}
.toast button{white-space:nowrap;border:0;background:transparent;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0;color:inherit}
.toast.alarm{font-weight:700}
/* timer: a floating mini player, and a focus sheet with a ring */
body.has-timer{padding-bottom:84px}
body.has-timer .toast{bottom:86px}
.tmini{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:22;display:flex;align-items:center;gap:12px;width:min(440px, calc(100% - 24px));padding:8px 8px 8px 18px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 14px 30px -14px rgba(0,0,0,.5);cursor:pointer;border:0;text-align:left;font:inherit}
.tmini .tm-dot{width:8px;height:8px;border-radius:50%;background:#4cd964;flex:0 0 auto;animation:tmpulse 1.6s ease-in-out infinite}
.tmini.paused .tm-dot{background:#999;animation:none}
@keyframes tmpulse{50%{opacity:.25}}
.tmini .tm-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.tmini .tm-time{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;letter-spacing:.01em}
.tmini .tm-btn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tmini .tm-btn svg{width:16px;height:16px;display:block}
.tsheet{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(10,10,10,.42);padding:20px}
.ts-box{position:relative;width:min(420px,100%);background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:22px 24px 26px;display:flex;flex-direction:column;align-items:center;gap:18px}
.ts-close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ts-close:hover{background:var(--line);color:var(--ink)}
.ts-close svg{width:20px;height:20px}
.ts-title{margin:8px 36px 0;font-size:17px;font-weight:600;text-align:center;line-height:1.4;overflow-wrap:anywhere;word-break:keep-all}
.ts-ring{position:relative;width:240px;height:240px}
.ts-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ts-ring circle{fill:none;stroke-width:6}
.ts-ring .track{stroke:var(--line)}
.ts-ring .prog{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ts-ring.over .prog{stroke:var(--alert)}
.ts-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ts-time{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ts-sub{font-size:13px;color:var(--muted)}
.ts-goals{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ts-goals button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:13.5px;color:var(--muted);cursor:pointer}
.ts-goals button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.ts-actions{display:flex;align-items:center;justify-content:center;gap:22px;width:100%}
.ts-actions button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit}
.ts-play{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:0}
.ts-play svg{width:26px;height:26px}
.ts-done{height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;gap:6px}
.ts-done svg{width:18px;height:18px}
.ts-stop{height:52px;padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:14px}
.ts-stop:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
/* ---------- calendar ---------- */
.tabbar{display:none}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-title{font-size:18px;font-weight:700;margin:0 6px;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.cal-btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;height:32px;min-width:32px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cal-btn:hover{border-color:var(--ink)}
.cal-btn.icon{padding:0;width:32px}
.cal-btn svg{width:16px;height:16px}
.cal-tools{display:flex;align-items:center;gap:8px}
.seg2{display:inline-flex;border:1px solid var(--ink)}
.seg2 button{border:0;background:transparent;color:var(--ink);padding:5px 12px;font-size:13px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--line)}
.month .wd{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.month .wd.sun,.cal-cell.sun .cal-num{color:var(--alert)}
.cal-cell{position:relative;min-height:104px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:6px 6px 4px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.cal-cell:hover{background:color-mix(in srgb, var(--ink) 4%, transparent)}
.cal-cell.other{color:var(--muted)}
.cal-cell.other .cal-items{opacity:.55}
.cal-num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;margin:-2px 0 0 -2px}
.cal-cell.today .cal-num{background:var(--ink);color:var(--paper)!important}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-items{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-ev{display:block;font-size:11.5px;line-height:1.35;padding:1px 5px;border-left:3px solid var(--cat, var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb, var(--cat, var(--line)) 22%, transparent)}
.cal-ev.done{color:var(--muted);text-decoration:line-through;background:transparent}
.cal-ev.due{border-left-color:var(--alert);color:var(--alert);background:transparent}
.cal-ev .t{font-variant-numeric:tabular-nums;margin-right:3px;color:var(--muted)}
.cal-more{font-size:11px;color:var(--muted);padding-left:5px}
.cal-dots{display:none}
.day{margin-top:18px}
.day-head{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--ink);padding-top:10px;margin-bottom:6px}
.day-head h3{margin:0;font-size:16px;font-weight:700}
.day-head .tag{font-size:12px;color:var(--muted)}
.cal-add{display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.cal-add input{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:7px 2px;font-size:15px;outline:none;color:var(--ink)}
.cal-add input:focus{border-bottom-color:var(--ink)}
.cal-add button{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 14px;font-size:13px;cursor:pointer}
.class-list{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:6px}
.class-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:color-mix(in srgb, var(--cat, var(--line)) 30%, transparent);border-left:3px solid var(--cat, var(--muted));font-size:14px}
.class-item .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);min-width:92px}
.class-item .nm{font-weight:600}
.class-item .pl{color:var(--muted);font-size:13px;margin-left:auto}
.today-classes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.today-classes .tc{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb, var(--cat, var(--line)) 35%, transparent)}
.today-classes .tc b{font-variant-numeric:tabular-nums;font-weight:600}
.today-classes .tc.past{opacity:.5}
/* week */
.week{--hh:44px;display:grid;grid-template-columns:42px repeat(7,minmax(0,1fr));border-top:1px solid var(--ink)}
.wk-h{font-size:12px;text-align:center;padding:6px 0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:transparent;border-top:0;border-right:0;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}
.wk-h b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.wk-h.today b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper)}
.wk-h.sel{box-shadow:inset 0 -2px 0 var(--ink)}
.wk-h.sun{color:var(--alert)}
.wk-corner{border-bottom:1px solid var(--line)}
.wk-allday{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:22px}
.wk-allday .cal-ev{font-size:11px}
.wk-gut{position:relative}
.wk-gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hh) - 1px), var(--line) calc(var(--hh) - 1px), var(--line) var(--hh))}
.wk-col.today{background-color:color-mix(in srgb, var(--ink) 3%, transparent)}
.blk{position:absolute;left:2px;right:2px;overflow:hidden;padding:3px 5px;font-size:11.5px;line-height:1.3;border:0;text-align:left;cursor:pointer;font:inherit;font-size:11.5px;color:#1d1d1d;background:color-mix(in srgb, var(--cat, #d6d6d6) 75%, white);border-left:3px solid color-mix(in srgb, var(--cat, #9a9a9a) 100%, black 18%)}
.blk.task{background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-left-width:3px}
.blk.task.done{color:var(--muted);border-color:var(--line);text-decoration:line-through}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{display:block;font-size:10.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--alert);z-index:2;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--alert)}
.cal-ev.exam{border-left-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.cal-dots i.exam{background:var(--ink);border-radius:1px;transform:rotate(45deg)}
.blk.exam{background:var(--ink);color:var(--paper);border-left:3px solid var(--alert)}
.class-item.exam{background:var(--ink);color:var(--paper);border-left-color:var(--alert)}
.class-item.exam .tm,.class-item.exam .pl{color:var(--paper)}
/* study */
.st-sec{margin:0 0 30px}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--ink);padding-top:10px;margin-bottom:10px;flex-wrap:wrap}
.st-head h3{margin:0;font-size:16px;font-weight:700}
.st-form{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);margin-bottom:12px}
.st-title{border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:7px 2px;font-size:16px;outline:none;color:var(--ink)}
.st-row{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.st-row.end{justify-content:flex-end}
.st-form textarea,.unit-edit textarea{border:1px solid var(--line);background:transparent;padding:8px;font-size:14px;color:var(--ink);resize:vertical;outline:none;font-family:inherit;width:100%;box-sizing:border-box}
.st-form input.time-text,.st-form input[type="date"]{border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px;font-size:14px;color:var(--ink);width:70px;outline:none}
.st-form input.place{width:110px}
.st-form input[type="date"]{width:auto}
.dd-list{list-style:none;margin:0;padding:0}
.dd{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dd-n{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;letter-spacing:-.02em}
.dd.soon .dd-n{color:var(--alert)}
.dd.past{opacity:.55}
.dd-title{font-size:15.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;word-break:keep-all}
.dd-type{display:inline-block;font-size:11.5px;font-weight:600;border:1px solid var(--ink);padding:0 6px;margin-right:6px;vertical-align:2px}
.dd-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.st-past{margin-top:8px}
.st-total{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.st-total .v{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st-total .k{font-size:12.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:18px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.bar{flex:1;min-width:0;height:100%;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;outline:none}
.bar .bf{width:min(26px, 70%);background:var(--muted);border-radius:4px 4px 0 0;display:block;min-height:0}
.bar.today .bf{background:var(--ink)}
.bar:hover .bf,.bar:focus-visible .bf{background:var(--ink)}
.bar .bl{position:absolute;bottom:-20px;font-size:11px;color:var(--muted)}
.bar.today .bl{color:var(--ink);font-weight:700}
.bar .bv{font-size:11px;color:var(--ink);margin-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar:hover::after,.bar:focus-visible::after{content:attr(title);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:11.5px;padding:3px 8px;white-space:nowrap;z-index:3;pointer-events:none}
.cat-bars{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.cat-bars li{display:grid;grid-template-columns:minmax(80px, 140px) 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.cb-name{display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cb-track{height:10px;background:color-mix(in srgb, var(--ink) 6%, transparent);display:block;border-radius:0 4px 4px 0}
.cb-fill{display:block;height:100%;background:var(--ink);border-radius:0 4px 4px 0}
.cb-v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:70px;text-align:right}
.book-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.book{border:1px solid var(--line)}
.book.open{border-color:var(--ink)}
.book-head{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.book-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex-wrap:wrap}
.book-sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{display:block;height:6px;background:color-mix(in srgb, var(--ink) 8%, transparent);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--ink);border-radius:3px}
.units{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.unit{border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer}
.unit.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.book .st-row{padding:0 14px 12px}
.unit-edit{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.unit-edit .st-row{padding:0}
/* timetable editor */
.tt-box{width:min(560px,100%);gap:14px}
.tt-term{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tt-term input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:3px 2px;font-size:14px;color:var(--ink)}
.tt-list{display:flex;flex-direction:column;gap:12px}
.tt-course{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.tt-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt-row .dot{width:12px;height:12px}
.tt-course input[type="text"],.tt-course select{border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 2px;font-size:14px;color:var(--ink);outline:none;min-width:0}
.tt-course input[type="text"]:focus,.tt-course select:focus{border-bottom-color:var(--ink)}
.tt-name{flex:1;font-size:16px!important;font-weight:600}
.tt-place{flex:1}
.tt-slot{display:flex;align-items:center;gap:6px}
.tt-slot input{width:62px;text-align:center;font-variant-numeric:tabular-nums}
.tt-slot .x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 6px}
.tt-add{border:1px dashed var(--muted);background:transparent;color:var(--ink);padding:10px;font-size:14px;cursor:pointer}
.tt-add:hover{border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.38);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:40;overflow-y:auto}
.modal-box{width:min(440px,100%);background:var(--paper);color:var(--ink);padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px}
.modal-box h3{margin:0;font-weight:400}
.catedit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.catedit li{display:flex;align-items:center;gap:10px}
.catedit input[type="text"],.catadd input[type="text"]{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 2px;font-size:15px;outline:none}
.catedit input[type="text"]:focus,.catadd input[type="text"]:focus{border-bottom-color:var(--ink)}
input[type="color"]{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;cursor:pointer;flex:0 0 auto}
input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
input[type="color"]::-webkit-color-swatch{border:0;border-radius:50%}
input[type="color"]::-moz-color-swatch{border:0;border-radius:50%}
.catadd{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;background:var(--cat);padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.modal-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}

/* ================= MONO skin ================= */
[data-skin="mono"] .brand{font-size:14px;font-weight:700;letter-spacing:.02em}
[data-skin="mono"] nav.views button{font-size:14.5px;font-weight:500;padding:7px 10px;justify-content:space-between}
[data-skin="mono"] nav.views button[aria-current="true"]{background:var(--ink);color:var(--paper)}
[data-skin="mono"] nav.views button[aria-current="true"] .n{color:var(--paper)}
[data-skin="mono"] .catlist button{padding:5px 10px}
[data-skin="mono"] .catlist button[aria-current="true"]{font-weight:700;box-shadow:inset 2px 0 0 var(--ink)}
[data-skin="mono"] .sheet{padding:6px 0 48px 8px}
[data-skin="mono"] .dayhead .big{font-family:var(--font-num);font-size:46px;font-weight:500;letter-spacing:-.03em}
[data-skin="mono"] .dayhead .dow{font-size:12px;color:var(--muted);padding-bottom:5px;line-height:1.3;letter-spacing:.06em}
[data-skin="mono"] h2.view{font-size:22px;font-weight:700;letter-spacing:-.01em}
[data-skin="mono"] section.group h3{font-size:12px;font-weight:700;color:var(--muted);border-top:1px solid var(--ink);padding-top:8px;letter-spacing:.04em}

[data-skin="mono"] .title-in{border-bottom-width:2px}
[data-skin="mono"] input[type="date"],[data-skin="mono"] input[type="time"],[data-skin="mono"] select.sel{border-bottom-style:solid;border-bottom-color:var(--line)}
[data-skin="mono"] .quick button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
[data-skin="mono"] .primary{background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;padding:6px 16px}

[data-skin="mono"] .check input:checked + .box::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
[data-skin="mono"] .done-title{color:var(--muted);text-decoration:line-through}
[data-skin="mono"] .empty{font-size:14px}
[data-skin="mono"] .banner .note-sticky{border:1px solid var(--ink);background:transparent}
[data-skin="mono"] .toast{background:var(--ink);color:var(--paper)}
[data-skin="mono"] .modal-box{border:1px solid var(--ink)}
[data-skin="mono"] .modal-box h3{font-size:17px;font-weight:700}

.auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:min(340px,100%);display:flex;flex-direction:column;gap:12px}
.auth-box .brand{margin:0 0 8px}
.auth-box input{border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:10px 2px;font-size:16px;outline:none;color:var(--ink)}
.auth-box input:focus{border-bottom-color:var(--ink)}
.auth-box .primary{padding:10px 16px;font-size:15px}
.auth-msg{margin:0;min-height:1.4em;font-size:13px;color:var(--alert)}
.auth-msg.ok{color:var(--muted)}
.acct{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
label.linkbtn{cursor:pointer;position:relative}
label.linkbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  :root[data-skin="mono"]{
    --font-display:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;

  nav.views button[data-view="study"]{display:none}
  /* bottom tab bar */

    padding:6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    background:color-mix(in srgb, var(--paper) 90%, transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0 2px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:10.5px;font-weight:500;cursor:pointer}
  .tabbar button[aria-current="true"]{color:var(--ink);font-weight:700}
  .tabbar .ico{display:block;width:24px;height:24px}
  .tabbar button[aria-current="true"] .ico{stroke-width:2.2}

  /* calendar on phones */
  .cal-head{margin-bottom:10px}
  .cal-title{font-size:17px;min-width:0}
  .month .wd{font-size:11px;padding:4px 0}
  .cal-cell{min-height:58px;padding:4px 2px;align-items:center}
  .cal-num{font-size:13px;margin:0}
  .cal-items{display:none}
  .cal-dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:100%}

  .cats{flex-direction:row;align-items:center;gap:0;margin:2px -18px 0;padding:0 18px;overflow-x:auto;scrollbar-width:none}

  .chipbtn{padding:5px 12px;font-size:13.5px}

  .listbar{justify-content:flex-end;margin-bottom:0}
  .listbar select.sel{font-size:14px!important;border:0;color:var(--muted)}

  /* rows: title gets the full width; time, tags and actions share the line under it */
  [data-skin="mono"] section.group h3{font-size:12.5px;padding-top:12px;margin-bottom:0}

  .body{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"title title title" "pill meta acts";align-items:center;column-gap:0;row-gap:2px}
  .line1{display:contents}
  .line1 > .title,.line1 > .done-title{grid-area:title}

  .meta{grid-area:meta;min-width:0;gap:4px 8px}
  .line1 > .acts{grid-area:acts;margin:0 -8px 0 4px;gap:0;justify-self:end}

  .icon-btn svg{width:18px;height:18px}

  .detail{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 0 4px 0;border-left:0;border-top:1px dashed var(--line);margin-top:8px}

  .detail input,.detail select,.detail textarea{width:100%;min-width:0;box-sizing:border-box}
  html,body{overflow-x:hidden}
  .detail .wide{grid-column:1 / -1}

  .toast{bottom:calc(84px + env(safe-area-inset-bottom));border-radius:12px}
  body.has-timer{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  body.has-timer .toast{bottom:calc(140px + env(safe-area-inset-bottom))}
  .tmini{bottom:calc(74px + env(safe-area-inset-bottom));width:calc(100% - 20px)}
  .tsheet{padding:0;align-items:flex-end;background:rgba(10,10,10,.3)}
  .ts-box{width:100%;min-height:calc(100% - 40px);border:0;border-radius:22px 22px 0 0;padding:18px 22px calc(30px + env(safe-area-inset-bottom));justify-content:center;gap:24px}
  .ts-box::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--line)}
  .ts-ring{width:min(280px, 72vw);height:min(280px, 72vw)}
  .ts-time{font-size:58px}
  .modal{padding:40px 14px}
  .modal-box{border-radius:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

  // ---- study time ----
  function rangeOf(r){

  // per-day, per-category totals from timer sessions (older totals without sessions count on the day they were finished)
  function studyLog(){
    const byDay = {};
    const add = (day, cat, ms) => { if (ms <= 0) return; (byDay[day] = byDay[day] || {})[cat] = ((byDay[day] || {})[cat] || 0) + ms; };
    const now = Date.now();
    for (const it of all()) {
      if (it.deleted) continue;
      const cat = catOf(it) ? it.categoryId : "";
      let logged = 0;
      for (const ss of (Array.isArray(it.sessions) ? it.sessions : [])) { const ms = ss.e - ss.s; logged += ms; add(ymd(new Date(ss.s)), cat, ms); }
      if (it.timerStart) add(ymd(new Date(it.timerStart)), cat, now - it.timerStart);
      const legacy = (it.spent || 0) - logged;
      if (legacy > 60000) add(ymd(new Date(it.doneAt || it.updatedAt || now)), cat, legacy);
    }
    return byDay;
  }

      const units = Array.isArray(b.units) ? b.units : [];
      const done = units.filter((u) => u.done).length, pct = units.length ? Math.round(done / units.length * 100) : 0;
      const isOpen = openBook === b.id;
      const next = units.find((u) => !u.done);
      let body = "";
      if (isOpen) {
        body = editUnitsBook === b.id
          ? '<div class="unit-edit"><textarea data-unit-edit rows="' + Math.min(12, Math.max(4, units.length + 1)) + '" aria-label="단원 목록">' + esc(units.map((u) => u.name).join("\n")) + '</textarea><div class="st-row end"><button type="button" class="mini always" data-st="cancel-units">취소</button><button type="button" class="primary" data-st="save-units">저장</button></div></div>'
          : '<div class="units">' + units.map((u) => '<button type="button" class="unit' + (u.done ? " on" : "") + '" data-st="unit" data-unit="' + esc(u.id) + '" aria-pressed="' + !!u.done + '">' + esc(u.name) + "</button>").join("") + "</div>" +
            '<div class="st-row end"><button type="button" class="mini always" data-st="edit-units">단원 편집</button><button type="button" class="mini always danger" data-st="del-book">교재 삭제</button></div>';
      }
      return '<li class="book' + (isOpen ? " open" : "") + '" data-book="' + esc(b.id) + '">' +
        '<button type="button" class="book-head" data-st="open-book" aria-expanded="' + isOpen + '"><span class="book-title">' + esc(b.title || "교재") + catTag(b.categoryId) + "</span>" +
        '<span class="book-sub">' + (units.length ? done + "/" + units.length + " · " + pct + "%" + (next && !isOpen ? " · 다음: " + esc(next.name) : "") : "단원 없음") + "</span>" +
        '<span class="prog"><span style="width:' + pct + '%"></span></span></button>' + body + "</li>";
    }).join("") + "</ul>";
    return h + "</section>";
  }
  function studyHTML(){ return examsHTML() + statsHTML() + booksHTML(); }
  function unitsFrom(text, count, old){
    let names = String(text || "").split(/\n/).map((x) => x.trim()).filter(Boolean);
    if (!names.length && count > 0) names = Array.from({length: Math.min(200, count)}, (_, i) => (i + 1) + "장");
    const prev = new Map((old || []).map((u) => [u.name, u]));
    return names.map((n) => prev.get(n) ? Object.assign({}, prev.get(n)) : {id: newId("u"), name: n, done: false});
  }
  content.addEventListener("click", (e) => {
    const b = e.target.closest("[data-st],[data-etype]"); if (!b) return;
    if (b.dataset.etype) {
      const f = b.closest("form"); f.elements.examType.value = b.dataset.etype;
      f.querySelectorAll("[data-etype]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      return;
    }
    const a = b.dataset.st;
    const examId = b.closest("[data-exam]") && b.closest("[data-exam]").dataset.exam;
    const bookId = b.closest("[data-book]") && b.closest("[data-book]").dataset.book;
    if (a === "add-exam") examForm = {};
    else if (a === "cancel") examForm = null;
    else if (a === "edit-exam") examForm = {id: examId};
    else if (a === "del-exam") {
      const cur = items.get(examId); commit(examId, Object.assign({}, cur, {deleted: true}));
      showToast("삭제됨", "되돌리기", () => { const c = items.get(examId); if (c) { commit(examId, Object.assign({}, c, {deleted: false})); render(); } });
    }
    else if (a === "toggle-past") showPastExams = !showPastExams;
    else if (a === "range") { statsRange = b.dataset.range; lsSet(STATS_KEY, statsRange); }
    else if (a === "add-book") bookForm = true;
    else if (a === "cancel-book") { bookForm = false; bookDraft = null; }
    else if (a === "open-book") { openBook = openBook === bookId ? null : bookId; editUnitsBook = null; }
    else if (a === "unit") {
      const cur = items.get(bookId); const uid = b.dataset.unit;
      commit(bookId, Object.assign({}, cur, {units: cur.units.map((u) => u.id === uid ? Object.assign({}, u, {done: !u.done, doneAt: u.done ? null : Date.now()}) : u)}));
    }
    else if (a === "edit-units") editUnitsBook = bookId;
    else if (a === "cancel-units") editUnitsBook = null;
    else if (a === "save-units") {
      const cur = items.get(bookId); const ta = b.closest(".unit-edit").querySelector("textarea");
      commit(bookId, Object.assign({}, cur, {units: unitsFrom(ta.value, 0, cur.units)}));
      editUnitsBook = null;
    }
    else if (a === "del-book") {
      const cur = items.get(bookId); commit(bookId, Object.assign({}, cur, {deleted: true})); openBook = null;
      showToast("'" + (cur.title || "교재") + "' 삭제됨", "되돌리기", () => { const c = items.get(bookId); if (c) { commit(bookId, Object.assign({}, c, {deleted: false})); render(); } });
    }
    else return;
    render();
    if (a === "add-exam" || a === "edit-exam" || a === "add-book") { const f = content.querySelector(".st-form .st-title"); if (f) f.focus(); }
  });
  content.addEventListener("submit", (e) => {
    const kind = e.target.dataset && e.target.dataset.stForm; if (!kind) return;
    e.preventDefault();
    const f = e.target.elements, now = Date.now();
    if (kind === "exam") {
      const time = f.time.value.trim() ? normTime(f.time.value) : "";
      if (time === null) { showToast("시간 형식: 13:30"); f.time.focus(); return; }
      if (!f.date.value) { f.date.focus(); return; }
      const data = {kind: "exam", examType: f.examType.value || "exam", title: f.title.value.trim(), date: f.date.value, time, place: f.place.value.trim(), categoryId: f.categoryId.value === "__new" ? "" : f.categoryId.value, deleted: false};
      if (examForm && examForm.id) commit(examForm.id, Object.assign({}, items.get(examForm.id), data));
      else commit(newId("x"), Object.assign(data, {createdAt: now}));
      examForm = null;
    } else if (kind === "book") {
      const units = unitsFrom(f.units.value, parseInt(f.count.value, 10) || 0, []);
      commit(newId("b"), {kind: "book", title: f.title.value.trim(), categoryId: f.categoryId.value === "__new" ? "" : f.categoryId.value, units, deleted: false, createdAt: now});
      bookForm = false;
      bookDraft = null;
    }
    render();
  });

  // ================= nav, backup =================
  function go(v){
    view = v;
    try { history.replaceState(null, "", "#" + v); } catch (e) {}
    setNewDate(defaultDateFor(v));
    render();
  }
  $("#nav").addEventListener("click", (e) => { const b = e.target.closest("[data-view]"); if (b) go(b.dataset.view); });
  let lastTodoView = TODO_VIEWS.includes(view) ? view : "today";
  $("#tabbar").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    const t = b.dataset.tab;
    if (t === "todo") go(TODO_VIEWS.includes(view) ? view : lastTodoView);
    else if (view !== t) { if (TODO_VIEWS.includes(view)) lastTodoView = view; go(t); }
    window.scrollTo(0, 0);
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== view) go(h); });

  // ================= cover photo =================
  let coverMoving = false, coverDrag = null, coverY = null;
  const canUpload = () => !!(sb && uid && mode === "cloud");
  function renderCover(){
    const box = $("#cover"), img = $("#coverImg");
    const url = settings.coverUrl;
    box.hidden = !canUpload() && !url;
    box.classList.toggle("empty", !url);
    $("#coverAdd").hidden = !canUpload();
    $("#coverDel").hidden = !canUpload() || !url;
    $("#coverMove").hidden = !url;
    if (!url) { coverMoving = false; img.hidden = true; img.removeAttribute("src"); }
    else {
      if (img.getAttribute("src") !== url) img.src = url;
      img.hidden = false;
      if (!coverDrag) img.style.objectPosition = "50% " + (coverY != null ? coverY : settings.coverY) + "%";
    }
    box.classList.toggle("moving", coverMoving);
  }
  $("#coverImg").addEventListener("error", () => { $("#coverImg").hidden = true; });
  async function shrinkImage(file){
    try {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
      const bmp = await createImageBitmap(file);
      const max = 2400;
      if (bmp.width <= max && file.size < 1500000) return file;
      const k = Math.min(1, max / bmp.width);
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.86));
      return blob && blob.size < file.size ? blob : file;
    } catch (e) { return file; }
  }
  $("#coverFile").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file || !canUpload()) return;
    if (!navigator.onLine) { showToast("오프라인 상태예요"); return; }
    const box = $("#cover");
    box.classList.add("busy");
    try {
      const blob = await shrinkImage(file);
      const type = blob.type || "image/jpeg";
      const ext = type === "image/png" ? "png" : type === "image/webp" ? "webp" : type === "image/gif" ? "gif" : "jpg";
      const path = uid + "/" + newId("cover") + "." + ext;
      const up = await sb.storage.from("covers").upload(path, blob, {contentType: type, cacheControl: "31536000", upsert: false});
      if (up.error) throw up.error;
      const sg = await sb.storage.from("covers").createSignedUrl(path, 60 * 60 * 24 * 365 * 10);
      if (sg.error) throw sg.error;
      const oldPath = settings.coverPath;
      coverY = null;
      commitSettings({coverPath: path, coverUrl: sg.data.signedUrl, coverY: 50});
      render();
      if (oldPath && oldPath !== path) sb.storage.from("covers").remove([oldPath]).catch(() => {});
    } catch (err) {
      console.warn("cover", err);
      showToast(/size|large/i.test(String(err && err.message)) ? "사진이 너무 커요" : "사진을 올리지 못했어요");
    } finally {
      box.classList.remove("busy");
    }
  });
  $("#coverDel").addEventListener("click", () => {
    const oldPath = settings.coverPath; if (!settings.coverUrl) return;
    showToast("커버 사진 삭제?", "삭제", () => {
      commitSettings({coverPath: "", coverUrl: "", coverY: 50});
      render();
      if (oldPath && sb) sb.storage.from("covers").remove([oldPath]).catch(() => {});
    });
  });
  $("#coverMove").addEventListener("click", () => { coverMoving = !coverMoving; renderCover(); });
  $("#coverImg").addEventListener("pointerdown", (e) => {
    if (!coverMoving) return;
    e.preventDefault();
    const img = e.currentTarget, box = $("#cover");
    const scale = box.clientWidth / (img.naturalWidth || box.clientWidth);
    const overflow = Math.max(1, (img.naturalHeight || box.clientHeight) * scale - box.clientHeight);
    coverDrag = {y: e.clientY, start: coverY != null ? coverY : settings.coverY, overflow};
    try { img.setPointerCapture(e.pointerId); } catch (err) {}
  });
  $("#coverImg").addEventListener("pointermove", (e) => {
    if (!coverDrag) return;
    coverY = Math.max(0, Math.min(100, coverDrag.start - (e.clientY - coverDrag.y) / coverDrag.overflow * 100));
    e.currentTarget.style.objectPosition = "50% " + coverY + "%";
  });
  function endCoverDrag(){
    if (!coverDrag) return;
    coverDrag = null;
    if (coverY != null && Math.abs(coverY - settings.coverY) > 0.1) commitSettings({coverY: Math.round(coverY * 10) / 10});
    coverY = null;
    renderCover();
  }
  $("#coverImg").addEventListener("pointerup", endCoverDrag);
  $("#coverImg").addEventListener("pointercancel", endCoverDrag);

  $("#backupBtn").addEventListener("click", () => {
    const payload = JSON.stringify({exportedAt: new Date().toISOString(), settings, items: Object.fromEntries(items)}, null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload], {type: "application/json"}));
    a.download = "planner-backup-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
  $("#importFile").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    let obj;
    try { obj = JSON.parse(await file.text()); } catch (err) { showToast("백업 파일이 아니에요"); return; }
    const src = obj && typeof obj.items === "object" ? obj.items : null;
    if (!src) { showToast("백업 파일이 아니에요"); return; }
    let n = 0;
    for (const [id, d] of Object.entries(src)) {
      if (!d || typeof d !== "object" || d.purged || id === SETTINGS_ID) continue;
      const cur = items.get(id);
      if (cur && (cur.updatedAt || 0) >= (d.updatedAt || 0)) continue;
      const data = Object.assign({}, d, {updatedAt: Math.max(d.updatedAt || 0, Date.now())});
      items.set(id, data);
      outbox[id] = {op: "set", data};
      n++;
    }
    const incoming = normSettings(obj.settings || {});
    const have = new Set(settings.categories.map((c) => c.id));
    const extra = incoming.categories.filter((c) => !have.has(c.id));
    if (extra.length) commitSettings({categories: settings.categories.concat(extra)});
    persist();
    scheduleFlush(200);
    migrated = false;
    migrate();
    showToast(n + "개 가져옴");
  });

  const now0 = new Date();
  $("#todayLabel").innerHTML = '<span class="big">' + pad(now0.getMonth() + 1) + "." + pad(now0.getDate()) + '</span><span class="dow">' + WD_EN[now0.getDay()] + "<br>" + WD[now0.getDay()] + "요일</span>";

  // ================= cloud =================
  let pulledAt = lsGet(PULL_KEY, null);
  let pulling = false, pullAgain = false, firstPullDone = false;
  function schedulePull(d){ clearTimeout(pullTimer); pullTimer = setTimeout(pull, d == null ? 400 : d); }
  async function pull(){
    if (!sb || !uid || !navigator.onLine) { updateStatus(); return; }
    if (pulling) { pullAgain = true; return; }
    pulling = true;
    try {
      // re-read a few seconds of overlap so a write that committed late is never skipped
      let since = pulledAt && pulledAt.uid === uid ? new Date(Date.parse(pulledAt.ts) - 5000).toISOString() : "1970-01-01T00:00:00.000Z";
      let changed = false;
      for (;;) {
        const {data, error} = await sb.from("items").select("id,data,server_ts").gt("server_ts", since).order("server_ts", {ascending: true}).limit(1000);
        if (error) throw error;
        for (const r of data) {
          since = r.server_ts;
          if (outbox[r.id]) continue;
          if (!r.data || r.data.purged) { if (items.delete(r.id)) changed = true; }
          else { items.set(r.id, r.data); changed = true; }
        }
        if (data.length < 1000) break;
      }
      const sres = await sb.from("settings").select("data").maybeSingle();
      if (sres.error) throw sres.error;
      if (sres.data && sres.data.data && !outbox[SETTINGS_ID]) {
        const next = normSettings(sres.data.data);
        if (JSON.stringify(next) !== JSON.stringify(settings)) { settings = next; changed = true; }
      }
      pulledAt = {uid, ts: since};
      lsSet(PULL_KEY, pulledAt);
      if (lastError === "offline") lastError = null;
      if (changed) { lsSet(CACHE_KEY, Object.fromEntries(items)); lsSet(SETTINGS_KEY, settings); }
      if (!firstPullDone) { firstPullDone = true; migrate(); }
      if (changed && !drag && !editingTime && $("#catModal").hidden) render();
    } catch (e) {
      if (isNetErr(e)) lastError = "offline";
      console.warn("pull", e);
    }
    pulling = false;
    updateStatus();
    if (pullAgain) { pullAgain = false; schedulePull(200); }
  }
  let channel = null;
  function subscribeRealtime(){
    try {
      if (channel) sb.removeChannel(channel);
      channel = sb.channel("planner-" + uid)
        .on("postgres_changes", {event: "*", schema: "public", table: "items", filter: "user_id=eq." + uid}, () => schedulePull(300))
        .on("postgres_changes", {event: "*", schema: "public", table: "settings", filter: "user_id=eq." + uid}, () => schedulePull(300))
        .subscribe();
    } catch (e) { console.warn("realtime", e); }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { schedulePull(50); scheduleFlush(100); } });
  setInterval(() => { if (!document.hidden) pull(); }, 60000);

  // ---- auth ----
  let authMode = "login";
  function showAuth(msg){
    $("#auth").hidden = false;
    $("#authMsg").textContent = msg || "";
    $("#authMsg").className = "auth-msg";
    setTimeout(() => $("#authEmail").focus(), 50);
  }
  $("#authSwitch").addEventListener("click", () => {
    authMode = authMode === "login" ? "signup" : "login";
    $("#authGo").textContent = authMode === "login" ? "로그인" : "가입하기";
    $("#authSwitch").textContent = authMode === "login" ? "가입하기" : "로그인";
    $("#authPw").setAttribute("autocomplete", authMode === "login" ? "current-password" : "new-password");
    $("#authPw").placeholder = authMode === "login" ? "비밀번호" : "비밀번호 (6자 이상)";
    $("#authMsg").textContent = "";
  });
  $("#authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#authMsg");
    msg.className = "auth-msg";
    if (!navigator.onLine) { msg.textContent = "인터넷 연결이 필요해요"; return; }
    const email = $("#authEmail").value.trim(), password = $("#authPw").value;
    $("#authGo").disabled = true;
    try {
      if (authMode === "signup") {
        const {data, error} = await sb.auth.signUp({email, password});
        if (error) throw error;
        if (data.session) onSignedIn(data.session);
        else { msg.className = "auth-msg ok"; msg.textContent = "메일함의 확인 링크를 누른 뒤 로그인해 주세요"; authMode = "signup"; $("#authSwitch").click(); }
      } else {
        const {data, error} = await sb.auth.signInWithPassword({email, password});
        if (error) throw error;
        onSignedIn(data.session);
      }
    } catch (err) {
      const m = String(err && err.message || "");
      msg.textContent = /confirm/i.test(m) ? "메일 확인이 필요해요" : /already/i.test(m) ? "이미 가입된 이메일이에요" : /password/i.test(m) && authMode === "signup" ? "비밀번호는 6자 이상" : /invalid/i.test(m) ? "이메일 또는 비밀번호가 맞지 않아요" : "로그인하지 못했어요";
    } finally {
      $("#authGo").disabled = false;
    }
  });
  function onSignedIn(session){
    if (!session || !session.user) return;
    const newUid = session.user.id;
    const lastUid = lsGet(LAST_UID_KEY, null);
    if (lastUid && lastUid !== newUid) {
      items = new Map(); outbox = {}; settings = normSettings(null); pulledAt = null;
      persist();
    } else if (!lastUid) {
      for (const [id, d] of items) if (!outbox[id]) outbox[id] = {op: "set", data: d};
      if (settings.categories.length && !outbox[SETTINGS_ID]) outbox[SETTINGS_ID] = {op: "set", data: settings};
      persist();
    }
    lsSet(LAST_UID_KEY, newUid);
    uid = newUid;
    mode = "cloud";
    $("#auth").hidden = true;
    $("#acctEmail").textContent = session.user.email || "";
    $("#logoutBtn").hidden = false;
    subscribeRealtime();
    flush();
    pull();
    render();
  }
  $("#logoutBtn").addEventListener("click", () => {
    showToast("로그아웃?", "로그아웃", async () => {
      try { await sb.auth.signOut(); } catch (e) {}
      uid = null; mode = "loading";
      if (channel) { try { sb.removeChannel(channel); } catch (e) {} channel = null; }
      $("#logoutBtn").hidden = true; $("#acctEmail").textContent = "";
      showAuth();
      render();
    });
  });

  async function start(){
    setNewDate(defaultDateFor(view));
    syncNewRemind();
    syncAlarmBtn();
    render();
    setInterval(() => { if (!document.hidden) updateTimerBar(); }, 1000);
    setInterval(checkReminders, 10000);
    setTimeout(checkReminders, 1500);
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
    const cfg = window.PLANNER_CONFIG || {};
    if (!window.supabase || !cfg.url || !cfg.anonKey || /YOUR_/.test(cfg.url + cfg.anonKey)) { mode = "local"; migrate(); render(); return; }
    sb = window.supabase.createClient(cfg.url, cfg.anonKey, {auth: {persistSession: true, autoRefreshToken: true, storageKey: AUTH_KEY, detectSessionInUrl: true}});
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" && uid) { uid = null; mode = "loading"; $("#logoutBtn").hidden = true; showAuth("다시 로그인해 주세요"); updateStatus(); }
      else if (session && session.user && session.user.id !== uid) setTimeout(() => onSignedIn(session), 0);
    });
    // Works offline: the stored session is enough to show this account's data and queue changes.
    const stored = lsGet(AUTH_KEY, null);
    const u = stored && (stored.user || (stored.currentSession && stored.currentSession.user));
    if (u && u.id) onSignedIn({user: u});
    else { mode = "loading"; updateStatus(); showAuth(); }
  }
  start();
})();
</script>
</body>
